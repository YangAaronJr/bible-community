<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Newsreader (Editorial Scripture & Reflections) & Inter (Calm UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        },
      },
    };

  <style>
    :root {
      --bg-studio: #E7E4DC;
      --bg-paper: #FAF9F6;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2EFE7;
      --border-hairline: #E5E0D5;
      --text-ink: #1F2937;
      --text-muted: #6B7280;
      --accent-sage: #4A6B5D;
      --accent-sage-soft: #EBF1EE;
      --accent-amber: #B47B44;
      --accent-amber-soft: #FBF5EE;
    }

    html.dark {
      --bg-studio: #0B0B0A;
      --bg-paper: #141413;
      --bg-card: #1E1E1C;
      --bg-subtle: #252522;
      --border-hairline: #2E2E2A;
      --text-ink: #F3F2EE;
      --text-muted: #9CA3AF;
      --accent-sage: #7C9A82;
      --accent-sage-soft: rgba(124, 154, 130, 0.16);
      --accent-amber: #D49A6A;
      --accent-amber-soft: rgba(212, 154, 106, 0.16);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-studio);
      color: var(--text-ink);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-editorial {
      font-family: 'Newsreader', Georgia, serif;
    }

    .theme-paper {
      background-color: var(--bg-paper);
      color: var(--text-ink);
    }

    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-hairline);
    }

    .theme-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-hairline);
    }

    .theme-border {
      border-color: var(--border-hairline);
    }

    .theme-muted {
      color: var(--text-muted);
    }

    .theme-sage-bg {
      background-color: var(--accent-sage);
      color: #FFFFFF;
    }
    html.dark .theme-sage-bg {
      color: #141413;
      font-weight: 600;
    }

    .theme-sage-pill {
      background-color: var(--accent-sage-soft);
      color: var(--accent-sage);
    }

    .theme-amber-pill {
      background-color: var(--accent-amber-soft);
      color: var(--accent-amber);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .thin-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(124, 154, 130, 0.35);
      border-radius: 9999px;
    }

    /* 390 x 844 iPhone Frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      background-color: var(--bg-paper);
      color: var(--text-ink);
      border-radius: 44px;
      box-shadow:
        0 28px 65px -12px rgba(0, 0, 0, 0.24),
        0 0 0 9px #252523,
        0 0 0 11px rgba(156, 163, 175, 0.25);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    @media (max-width: 430px) {
      .phone-frame {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

          <button onclick="navigateRoot('social')" class="px-2 py-1 rounded-lg hover:bg-white/60 dark:hover:bg-white/10 font-medium">Social</button>
          <button onclick="openCircleRoom('grace')" class="px-2 py-1 rounded-lg hover:bg-white/60 dark:hover:bg-white/10 font-medium">Circle Room</button>

        <button

    // =========================================================================
    // 3. ACTIONS & CONTROLLERS
    // =========================================================================
    function toggleTheme() {
      state.darkMode = !state.darkMode;
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        document.getElementById('studio-theme-icon').textContent = '🌙';
        document.getElementById('studio-theme-label').textContent = 'Dark Charcoal';
      } else {
        html.classList.remove('dark');
        document.getElementById('studio-theme-icon').textContent = '☀️';
        document.getElementById('studio-theme-label').textContent = 'Warm Paper';
      }
      renderApp();
    }

    function navigateRoot(tab) {
      state.rootTab = tab;
      state.overlayScreen = null;
      state.readerPickerOpen = null;
      state.shareDrawerOpen = false;
      renderApp();
    }

    function openMemberProfile(memberId) {
      state.activeMemberId = memberId;
      state.overlayScreen = 'member';
      renderApp();
    }

    function openCircleRoom(circleId, subView = 'charlie') {
      state.activeCircleId = circleId;
      state.circleSubView = subView;
      state.circleHasActivity[circleId] = false;
      state.overlayScreen = 'circle-room';
      renderApp();
    }

    function openPersonalSettings() {
      state.overlayScreen = 'settings';
      renderApp();
    }

    function openAddFriendModal() {
      state.overlayScreen = 'add-friend';
      state.addFriendSuccess = false;
      state.friendCodeInput = '';
      renderApp();
    }

    function sendFriendRequest() {
      if (!state.friendCodeInput.trim()) return;
      state.addFriendSuccess = true;
      renderApp();
      setTimeout(() => {
        state.overlayScreen = null;
        state.addFriendSuccess = false;
        renderApp();
      }, 1800);
    }

    function submitReflection() {
      const text = state.shareDraftText.trim();
      if (!text) return;
      const destName =
        state.shareDestination === 'private'
          ? 'Private (Only Me)'
          : state.shareDestination === 'friends'
          ? 'All Friends'
          : state.circles[state.shareDestination]?.name || 'Circle';

      state.shareDraftText = '';
      state.shareDrawerOpen = false;
      state.shareToast = `Reflection saved to ${destName}`;
      renderApp();

      setTimeout(() => {
        state.shareToast = '';
        renderApp();
      }, 3000);
    }

          <!-- Scripture Canvas -->
          <div class="flex-1 overflow-y-auto thin-scroll px-6 py-5 space-y-4 font-editorial relative">
            ${state.shareToast ? `<div class="sticky top-0 z-20 px-3.5 py-2 rounded-2xl theme-sage-bg font-sans text-xs text-center shadow-md">✓ ${state.shareToast}</div>` : ''}
            <div class="text-center space-y-1 pb-1">
              <p class="font-sans text-[10px] uppercase tracking-widest theme-muted">${state.readerVersion} Translation</p>
              <h2 class="text-2xl font-semibold">${state.readerBook} ${state.readerChapter}</h2>
            </div>
            <p class="text-[16px] leading-[1.75]"><sup class="font-sans text-[10px] theme-muted mr-1">1</sup>In the beginning was the Word, and the Word was with God, and the Word was God.</p>
            <p class="text-[16px] leading-[1.75]"><sup class="font-sans text-[10px] theme-muted mr-1">4</sup>In Him was life, and that life was the light of men.</p>
            <div onclick="state.shareDrawerOpen = true; renderApp();" class="rounded-2xl theme-sage-pill p-3.5 cursor-pointer hover:opacity-95">
              <p class="text-[16px] leading-[1.7]"><sup class="font-sans text-[10px] mr-1">14</sup>And the Word became flesh and dwelt among us... <span class="font-sans text-xs underline font-semibold ml-2">✍️ Share Reflection</span></p>
            </div>
          </div>

          <!-- Reader Footer Bar -->
          <div class="theme-card border-t theme-border p-3.5 shrink-0 flex items-center justify-between">
            <button onclick="state.morningOtRead = !state.morningOtRead; renderApp();" class="px-3.5 py-2 rounded-xl border text-xs font-medium ${state.morningOtRead ? 'theme-sage-pill border-transparent' : 'theme-subtle'}">
              ${state.morningOtRead ? '✓ Chapter Read' : 'Mark Chapter Read'}
            </button>
            <button onclick="state.shareDrawerOpen = true; renderApp();" class="px-4 py-2 rounded-xl theme-sage-bg text-xs font-semibold">+ Jot Reflection</button>
          </div>

          <!-- Targeted Reflection Drawer -->
          ${state.shareDrawerOpen ? `
            <div class="absolute inset-0 z-50 bg-black/50 backdrop-blur-xs flex flex-col justify-end">
              <div class="theme-card rounded-t-[32px] p-6 space-y-4 border-t theme-border shadow-2xl">
                <div class="flex items-center justify-between pb-2 border-b theme-border"><h3 class="font-editorial text-lg font-semibold">Share Reflection</h3><button onclick="state.shareDrawerOpen = false; renderApp();" class="text-xs theme-muted">✕</button></div>
                <textarea oninput="state.shareDraftText = this.value" placeholder="What stood out to you in this passage?" class="w-full theme-subtle border rounded-2xl p-3 text-xs leading-relaxed h-28 resize-none outline-none focus:ring-2 focus:ring-[#4A6B5D]">${state.shareDraftText}</textarea>
                <div class="space-y-2">
                  <label class="text-[10px] font-semibold uppercase tracking-wider theme-muted block">Choose Destination</label>
                  <div class="grid grid-cols-2 gap-2 text-xs">
                    <button onclick="state.shareDestination = 'private'; renderApp();" class="p-2.5 rounded-xl border text-left ${state.shareDestination === 'private' ? 'theme-sage-pill border-transparent font-semibold' : 'theme-subtle'}">🔒 Private (Only Me)</button>
                    <button onclick="state.shareDestination = 'friends'; renderApp();" class="p-2.5 rounded-xl border text-left ${state.shareDestination === 'friends' ? 'theme-sage-pill border-transparent font-semibold' : 'theme-subtle'}">👥 All Friends</button>
                    <button onclick="state.shareDestination = 'grace'; renderApp();" class="p-2.5 rounded-xl border text-left ${state.shareDestination === 'grace' ? 'theme-sage-pill border-transparent font-semibold' : 'theme-subtle'}">🌿 Grace & Psalms</button>
                    <button onclick="state.shareDestination = 'mens'; renderApp();" class="p-2.5 rounded-xl border text-left ${state.shareDestination === 'mens' ? 'theme-sage-pill border-transparent font-semibold' : 'theme-subtle'}">⚔️ Men's Table</button>
                  </div>
                </div>
                <div class="pt-2 flex items-center gap-2">
                  <button onclick="state.shareDrawerOpen = false; renderApp();" class="flex-1 py-3 rounded-xl border text-xs font-medium theme-subtle">Cancel</button>
                  <button onclick="submitReflection()" class="flex-1 py-3 rounded-xl theme-sage-bg text-xs font-semibold shadow-2xs">Share to Destination</button>
                </div>
              </div>
            </div>
          ` : ''}
        `;
      } else if (state.rootTab === 'social') {
        mainContent = `
          ${renderGlobalTopHeader()}
          <div class="flex-1 overflow-y-auto thin-scroll px-5 py-3 space-y-6">
            <!-- Top Section: Friends Grid (3-4 per row) -->
            <div class="space-y-3">
              <div class="flex items-center justify-between px-1">
                <span class="text-[10px] font-semibold uppercase tracking-wider theme-muted">Friends (1-on-1 DMs)</span>
                <button onclick="openAddFriendModal()" class="text-xs text-[#4A6B5D] dark:text-[#7C9A82] font-semibold">+ Add Friend</button>
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${state.friendList.map(fid => {
                  const f = state.members[fid];
                  return `
                    <button onclick="openMemberProfile('${fid}')" class="theme-card border rounded-2xl p-3 flex flex-col items-center text-center hover:border-[#4A6B5D] transition-all relative group">
                      <div class="relative mb-2">
                        ${getAvatarSVG(fid, 52)}
                        ${fid === 'hannah' ? `<span class="absolute top-0 right-0 w-3 h-3 rounded-full bg-[#4A6B5D] ring-2 ring-white dark:ring-[#1E1E1C]"></span>` : ''}
                      </div>
                      <span class="text-xs font-semibold truncate w-full">${f.name}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Bottom Section: Circles Grid (3-4 per row) -->
            <div class="space-y-3">
              <div class="flex items-center justify-between px-1">
                <span class="text-[10px] font-semibold uppercase tracking-wider theme-muted">Your Circles</span>
                <button onclick="alert('Create a new circle drawer')" class="text-xs text-[#4A6B5D] dark:text-[#7C9A82] font-semibold">+ New Circle</button>
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${state.circleList.map(cid => {
                  const circ = state.circles[cid];
                  return `
                    <button onclick="openCircleRoom('${cid}')" class="theme-card border rounded-2xl p-3 flex flex-col items-center text-center hover:border-[#4A6B5D] transition-all">
                      <div class="mb-2">
                        ${getCircleAvatarSVG(cid, 52)}
                      </div>
                      <span class="text-xs font-semibold truncate w-full">${circ.name}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      } else {
        mainContent = `
          ${renderGlobalTopHeader()}
          <div class="flex-1 overflow-y-auto thin-scroll px-5 py-4 space-y-6">
            <div class="theme-card border rounded-2xl p-5 flex items-center justify-between shadow-2xs">
              <div>
                <p class="text-[10px] uppercase tracking-wider theme-muted">Chapters Read</p>
                <p class="font-editorial text-2xl font-semibold mt-0.5">142</p>
              </div>
              <div>
                <p class="text-[10px] uppercase tracking-wider theme-muted">Books Explored</p>
                <p class="font-editorial text-2xl font-semibold mt-0.5">18 / 66</p>
              </div>
            </div>

            <div class="space-y-3">
              <span class="text-[10px] font-semibold uppercase tracking-wider theme-muted px-1">Visual Scripture Mosaic</span>
              <div class="grid grid-cols-4 gap-2">
                ${state.journeyBooks.map(b => `
                  <div class="${b.status === 'done' ? 'theme-sage-bg text-white' : b.status === 'active' ? 'theme-amber-pill font-semibold' : 'theme-subtle theme-muted opacity-70'} rounded-2xl p-3 text-center">
                    <p class="text-xs font-bold tracking-tight">${b.code}</p>
                    <p class="text-[9px] mt-0.5 opacity-90">${b.status === 'done' ? 'Complete' : b.status === 'active' ? 'Read ' + b.read : '0 ch'}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      frame.innerHTML = `
        ${renderStatusBar()}
        ${mainContent}
        ${renderGlobalBottomNav()}
      `;
    }

    // Initialize prototype on load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
