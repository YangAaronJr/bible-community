  <style>
    /* Calm, unhurried typography & subtle scrollbars for 390x844 mobile frames */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ECEAE4;
      color: #1F2937;
      -webkit-font-smoothing: antialiased;
    }

    .font-editorial {
      font-family: 'Newsreader', Georgia, serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: #DCD6C8;
      border-radius: 9999px;
    }

    /* Mobile Device Frame */
    .phone-shell {
      width: 390px;
      height: 844px;
      background-color: #FAF9F6;
      border-radius: 44px;
      box-shadow:
        0 24px 60px -12px rgba(31, 41, 55, 0.16),
        0 0 0 10px #1F2937,
        0 0 0 12px #D6D0C4;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Clean Artboard Frame for Figma html.to.design import */
    .figma-artboard {
      width: 390px;
      height: 844px;
      background-color: #FAF9F6;
      border-radius: 28px;
      border: 1px solid #DCD6C8;
      box-shadow: 0 12px 32px -8px rgba(31, 41, 55, 0.08);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Slide-up Drawer transition */
    .drawer-sheet {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }
    .drawer-closed {
      transform: translateY(100%);
      pointer-events: none;
    }
    .drawer-open {
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Contenteditable placeholder & clean editor styling */
    [contenteditable="true"]:focus {
      outline: none;
    }
  </style>
</head>

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        state.toastMessage = null;
        render();
      }, 2800);
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const btnInt = document.getElementById('btn-mode-interactive');
      const btnFig = document.getElementById('btn-mode-figma');
      if (mode === 'interactive') {
        btnInt.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-[#FFFFFF] text-[#1F2937] shadow-xs';
        btnFig.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-[#6B7280] hover:text-[#1F2937]';
      } else {
        btnFig.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-[#FFFFFF] text-[#1F2937] shadow-xs';
        btnInt.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-[#6B7280] hover:text-[#1F2937]';
      }
      render();
    }

    function navigateTo(screen) {
      state.activeScreen = screen;
      state.showInvitePopover = false;
      state.showAttachmentTray = false;
      render();
      scrollChatToBottom();
    }

    function openMemberDrawer(memberId) {
      state.selectedMemberId = memberId;
      state.showInvitePopover = false;
      render();
    }

    function closeMemberDrawer() {
      state.selectedMemberId = null;
      render();
    }

    function openDmWith(memberId) {
      state.selectedMemberId = null;
      state.activeDmMemberId = memberId;
      state.activeScreen = 'dm';
      const member = state.members.find(m => m.id === memberId);
      if (member) member.unreadDm = false;
      render();
      scrollChatToBottom();
    }

    function sendRing(memberId) {
      if (state.rungMembers[memberId]) {
        showToast('Already rung · 24h gentle cooldown active');
        return;
      }
      const member = state.members.find(m => m.id === memberId);
      state.rungMembers[memberId] = true;
      showToast(`Sent gentle Ring to ${member ? member.shortName : 'friend'}: "Praying for your time in the Word today"`);
      render();
    }

    function copyInviteCode() {
      const tempInput = document.createElement('input');
      tempInput.value = '8HA99L';
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      state.showInvitePopover = false;
      showToast('Invite code 8HA99L copied to clipboard');
    }

    function togglePrayer(msgId) {
      state.prayingRequests[msgId] = !state.prayingRequests[msgId];
      render();
    }

    function sendGroupMessage(customType = 'text', customText = null) {
      const input = document.getElementById('group-chat-input');
      const text = customText || (input ? input.value.trim() : '');
      if (!text) return;

      const newMsg = {
        id: 'msg-' + Date.now(),
        senderId: 'aaron',
        senderName: 'Aaron (You)',
        isLeader: false,
        time: 'Just now',
        type: customType,
        content: text,
        otherPraying: customType === 'prayer' ? ['James'] : undefined,
      };

      state.groupMessages.push(newMsg);
      if (customType === 'prayer') {
        state.prayingRequests[newMsg.id] = false;
      }
      if (input) input.value = '';
      state.showAttachmentTray = false;
      render();
      scrollChatToBottom();
    }

    function sendDmMessage() {
      const input = document.getElementById('dm-chat-input');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const targetId = state.activeDmMemberId;
      if (!state.dmThreads[targetId]) state.dmThreads[targetId] = [];
      state.dmThreads[targetId].push({
        id: 'dm-' + Date.now(),
        fromMe: true,
        text,
        time: 'Just now',
      });

      const member = state.members.find(m => m.id === targetId);
      if (member) {
        member.dmPreview = text;
        member.dmTime = 'Now';
      }

      if (input) input.value = '';
      render();
      scrollChatToBottom();
    }

    function selectDoc(docId) {
      state.activeDocId = docId;

    function createNewDoc() {
      const newId = 'doc-' + Date.now();
      const count = state.docs.length + 1;
      state.docs.unshift({
        id: newId,
        title: `Study Note #${count}`,
        viewer: 'You are editing',
        updated: 'Saved to Circle',
        html: `
          <h2 class="font-editorial text-lg font-semibold text-[#1F2937] mb-1">Untitled Study Reflection</h2>
          <p class="text-xs text-[#6B7280] mb-3">Tap anywhere below to write together with your Circle...</p>
          <p class="text-[13.5px] text-[#1F2937]">Write key takeaways, questions, or verses here.</p>
        `,
        checklist: [
          { id: 'chk-' + Date.now(), text: 'Share summary in Circle chat when ready', done: false },
        ],
      });
      state.activeDocId = newId;
      showToast('Created new shared Circle doc');
      render();
    }

    function toggleDocCheck(docId, chkId) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc) return;
      const item = doc.checklist.find(c => c.id === chkId);
      if (item) item.done = !item.done;
      render();
    }

    function applyDocFormat(cmd) {
      const editor = document.getElementById('doc-rich-editor');
      if (!editor) return;
      editor.focus();
      if (cmd === 'h1') {
        document.execCommand('formatBlock', false, 'H2');
      } else if (cmd === 'h2') {
        document.execCommand('formatBlock', false, 'H3');
      } else if (cmd === 'bold') {
        document.execCommand('bold', false, null);
      } else if (cmd === 'list') {
        document.execCommand('insertUnorderedList', false, null);
      } else if (cmd === 'check') {
        const doc = state.docs.find(d => d.id === state.activeDocId);
        if (doc) {
          doc.checklist.push({ id: 'chk-' + Date.now(), text: 'New action item or prayer prompt', done: false });
          render();
          return;
        }
      }
      const badge = document.getElementById('doc-save-badge');
      if (badge) badge.textContent = 'Saving...';
      setTimeout(() => {
        if (badge) badge.textContent = 'Saved to Circle';
      }, 500);
    }

    function handleDocInput(el) {
      const doc = state.docs.find(d => d.id === state.activeDocId);
      if (doc) doc.html = el.innerHTML;
      const badge = document.getElementById('doc-save-badge');
      if (badge) badge.textContent = 'Saving...';
      clearTimeout(window._saveDocTimer);
      window._saveDocTimer = setTimeout(() => {
        if (badge) badge.textContent = 'Saved to Circle';
      }, 600);
    }

    function scrollChatToBottom() {
      setTimeout(() => {
        const scroller = document.querySelector('.chat-scroll-container');
        if (scroller) scroller.scrollTop = scroller.scrollHeight;
      }, 30);
    }

              if (msg.type === 'prayer') {
                const isPraying = !!state.prayingRequests[msg.id];

                  <div class="flex items-start gap-2.5">
                    <button onclick="openMemberDrawer('${msg.senderId}')" class="shrink-0 mt-0.5">

              // 4. Standard Text Reflection
              return `
                <div class="flex items-start gap-2.5 ${isMe ? 'justify-end' : ''}">

                    !isMe

                    isMe
                      ? 'bg-[#4A6B5D] text-white rounded-br-sm'
                      : 'bg-[#FFFFFF] border border-[#E6E1D6] text-[#1F2937] rounded-tl-sm'
                  }">
                    ${
                      !isMe
                        ? `<p class="text-[11px] font-semibold text-[#4A6B5D] mb-0.5">${msg.senderName}</p>`
                        : ''

                    <p class="text-[13px] leading-relaxed">${msg.content}</p>
                    <p class="text-[10px] mt-1 text-right ${isMe ? 'text-white/75' : 'text-[#6B7280]'}">${msg.time}</p>

        <!-- Attachment Tray (Toggled by + button) -->

                <span class="w-7 h-7 rounded-lg bg-[#EBF1EE] text-[#4A6B5D] flex items-center justify-center shrink-0">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>

            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>

        ${renderStatusBar()}

        <!-- Top Circle Docs Header -->
        <div class="px-4 py-2.5 bg-[#FAF9F6] border-b border-[#E6E1D6] flex items-center justify-between gap-2 shrink-0">
          <div class="flex items-center gap-2">
            <button
              onclick="navigateTo('group-chat')"
              aria-label="Back to Group Chat"
              class="w-8 h-8 rounded-full hover:bg-[#F4F1EA] flex items-center justify-center text-[#1F2937]"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h2 class="font-editorial text-[22px] font-medium text-[#1F2937] tracking-tight">Circle Docs</h2>
          </div>

          <button
            onclick="createNewDoc()"
            class="px-3 py-1.5 rounded-xl bg-[#4A6B5D] hover:bg-[#3D5A4E] text-white text-xs font-medium flex items-center gap-1 transition-colors"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            New
          </button>
        </div>

        <!-- Horizontal Switcher Pills -->
        <div class="px-4 py-2.5 bg-[#FAF9F6] flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0">
          ${state.docs
            .map(doc => {
              const isActive = doc.id === activeDoc.id;
              return `
                <button
                  onclick="selectDoc('${doc.id}')"
                  class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${
                    isActive
                      ? 'bg-[#4A6B5D] text-white'
                      : 'bg-[#F4F1EA] text-[#6B7280] border border-[#E6E1D6] hover:text-[#1F2937]'
                  }"
                >
                  ${doc.title}
                </button>
              `;
            })
            .join('')}
        </div>

        <!-- Distraction-Free Collaborative Editor Card -->
        <div class="flex-1 px-4 pb-5 flex flex-col min-h-0">
          <div class="flex-1 bg-[#FFFFFF] border border-[#E6E1D6] rounded-2xl shadow-2xs flex flex-col overflow-hidden">
            <!-- Presence & Auto-Save Status Bar -->
            <div class="px-3.5 py-2 bg-[#F4F1EA]/70 border-b border-[#E6E1D6] flex items-center justify-between text-[11px] shrink-0">
              <div class="flex items-center gap-1.5 text-[#1F2937] font-medium">
                <span class="w-2 h-2 rounded-full bg-[#4A6B5D] animate-pulse"></span>
                <span>${activeDoc.viewer}</span>
              </div>
              <span id="doc-save-badge" class="text-[#6B7280]">${activeDoc.updated}</span>
            </div>

            <!-- Minimal Rich-Text Formatting Toolbar -->
            <div class="px-3 py-1.5 border-b border-[#E6E1D6] flex items-center gap-1 bg-[#FAF9F6] shrink-0">
              <button onclick="applyDocFormat('h1')" class="px-2 py-1 rounded-lg text-[11px] font-semibold text-[#1F2937] hover:bg-[#E6E1D6]/60">H1</button>
              <button onclick="applyDocFormat('h2')" class="px-2 py-1 rounded-lg text-[11px] font-semibold text-[#1F2937] hover:bg-[#E6E1D6]/60">H2</button>
              <button onclick="applyDocFormat('bold')" class="px-2 py-1 rounded-lg text-[11px] font-bold text-[#1F2937] hover:bg-[#E6E1D6]/60">B</button>
              <button onclick="applyDocFormat('list')" class="px-2 py-1 rounded-lg text-[11px] font-medium text-[#1F2937] hover:bg-[#E6E1D6]/60">• List</button>
              <button onclick="applyDocFormat('check')" class="px-2 py-1 rounded-lg text-[11px] font-medium text-[#4A6B5D] hover:bg-[#EBF1EE]">☑ Check</button>
            </div>

            <!-- Editable Paper Canvas -->
            <div class="flex-1 overflow-y-auto thin-scroll p-4 space-y-3">
              <div
                id="doc-rich-editor"
                contenteditable="true"
                oninput="handleDocInput(this)"
                class="leading-relaxed text-[#1F2937]"
              >
                ${activeDoc.html}
              </div>

              <!-- Interactive Study Checkboxes -->
              <div class="space-y-2 pt-1">
                ${activeDoc.checklist
                  .map(
                    chk => `
                  <button
                    onclick="toggleDocCheck('${activeDoc.id}', '${chk.id}')"
                    class="w-full text-left flex items-start gap-2.5 p-2 rounded-xl bg-[#FAF9F6] border border-[#E6E1D6] hover:border-[#4A6B5D] transition-colors"
                  >
                    <span class="mt-0.5 w-4 h-4 rounded flex items-center justify-center shrink-0 ${
                      chk.done
                        ? 'bg-[#4A6B5D] text-white'
                        : 'bg-white border border-[#CCC5B6]'
                    }">
                      ${
                        chk.done
                          ? `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`
                          : ''
                      }
                    </span>
                    <span class="text-[12.5px] leading-snug ${
                      chk.done ? 'line-through text-[#6B7280]' : 'text-[#1F2937]'
                    }">
                      ${chk.text}
                    </span>
                  </button>
                `
                  )
                  .join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 5. MAIN RENDER CONTROLLER (INTERACTIVE PHONE VS. FIGMA ALL-FRAMES VIEW)
    // =========================================================================
    function render() {
      const workspace = document.getElementById('workspace');

      if (state.viewMode === 'interactive') {
        let activeScreenHTML = '';
        if (state.activeScreen === 'inbox') activeScreenHTML = renderScreen01Inbox(false);
        else if (state.activeScreen === 'group-chat') activeScreenHTML = renderScreen03GroupChat();
        else if (state.activeScreen === 'dm') activeScreenHTML = renderScreen04DirectMessage();
        else if (state.activeScreen === 'docs') activeScreenHTML = renderScreen05SharedDocs();

        workspace.innerHTML = `
          <div class="flex flex-col items-center gap-4">
            <!-- Quick Screen Jump Pills for Easy Testing -->
            <div class="flex flex-wrap items-center justify-center gap-1.5 text-xs">
              <span class="text-[#6B7280] mr-1">Jump to:</span>
              <button onclick="navigateTo('inbox')" class="px-2.5 py-1 rounded-full border ${
                state.activeScreen === 'inbox'
                  ? 'bg-[#4A6B5D] text-white border-[#4A6B5D]'
                  : 'bg-[#FAF9F6] text-[#1F2937] border-[#D6D0C4]'
              }">01 Inbox</button>
              <button onclick="openMemberDrawer('daniel')" class="px-2.5 py-1 rounded-full border ${
                state.selectedMemberId
                  ? 'bg-[#4A6B5D] text-white border-[#4A6B5D]'
                  : 'bg-[#FAF9F6] text-[#1F2937] border-[#D6D0C4]'
              }">02 Member Drawer</button>
              <button onclick="navigateTo('group-chat')" class="px-2.5 py-1 rounded-full border ${
                state.activeScreen === 'group-chat'
                  ? 'bg-[#4A6B5D] text-white border-[#4A6B5D]'
                  : 'bg-[#FAF9F6] text-[#1F2937] border-[#D6D0C4]'
              }">03 Group Chat</button>
              <button onclick="navigateTo('dm')" class="px-2.5 py-1 rounded-full border ${
                state.activeScreen === 'dm'
                  ? 'bg-[#4A6B5D] text-white border-[#4A6B5D]'
                  : 'bg-[#FAF9F6] text-[#1F2937] border-[#D6D0C4]'
              }">04 1-on-1 DM</button>
              <button onclick="navigateTo('docs')" class="px-2.5 py-1 rounded-full border ${
                state.activeScreen === 'docs'
                  ? 'bg-[#4A6B5D] text-white border-[#4A6B5D]'
                  : 'bg-[#FAF9F6] text-[#1F2937] border-[#D6D0C4]'
              }">05 Shared Docs</button>
            </div>

            <!-- 390 x 844 Interactive Mobile Phone Shell -->
            <div class="phone-shell">
              ${activeScreenHTML}

              <!-- Gentle Toast Confirmation Banner -->
              ${
                state.toastMessage
                  ? `
                  <div class="absolute top-12 left-4 right-4 z-50 bg-[#1F2937] text-[#FAF9F6] text-xs font-medium px-3.5 py-2.5 rounded-2xl shadow-lg flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#7FB09A] shrink-0"></span>
                    <span>${state.toastMessage}</span>
                  </div>
                  `
                  : ''
              }

              <!-- Slide-Up Member Card Drawer Overlay -->
              ${
                state.selectedMemberId
                  ? `
                  <div
                    onclick="if(event.target === this) closeMemberDrawer()"
                    class="absolute inset-0 z-40 bg-[#1F2937]/30 backdrop-blur-[1px] flex flex-col justify-end"
                  >
                    <div class="drawer-sheet drawer-open">
                      ${renderMemberCardSheet(state.selectedMemberId, false)}
                    </div>
                  </div>
                  `
                  : ''
              }
            </div>
          </div>
        `;
      } else {
        // FIGMA ALL-FRAMES VIEW: 5 side-by-side 390x844 artboards ready for html.to.design
        const artboards = [
          { label: '01 · Circles Inbox', content: renderScreen01Inbox(true) },
          { label: '02 · Slide-Up Member Card', content: renderScreen02Artboard() },
          { label: '03 · Group Chat & Prayer Cards', content: renderScreen03GroupChat() },
          { label: '04 · 1-on-1 Direct Message', content: renderScreen04DirectMessage('daniel') },
          { label: '05 · Shared Circle Docs', content: renderScreen05SharedDocs() },
        ];

        workspace.innerHTML = `
          <div class="w-full max-w-full flex flex-col gap-4">
            <div class="max-w-3xl mx-auto text-center px-4">
              <p class="text-xs text-[#6B7280]">
                <strong class="text-[#1F2937]">Figma Import Tip:</strong> Open this page in your browser and run the free <code class="px-1.5 py-0.5 rounded bg-[#FAF9F6] border border-[#D6D0C4] text-[#4A6B5D]">html.to.design</code> Figma plugin to convert all 5 artboards below into editable Auto-Layout layers.
              </p>
            </div>

            <div class="flex items-start gap-8 px-6 pb-8 overflow-x-auto">
              ${artboards
                .map(
                  board => `
                <div class="flex flex-col gap-2.5 shrink-0">
                  <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-semibold text-[#1F2937] tracking-tight">${board.label}</span>
                    <span class="text-[11px] font-mono text-[#6B7280]">390 × 844</span>
                  </div>
                  <div class="figma-artboard">
                    ${board.content}
                  </div>
                </div>
              `
                )
                .join('')}
            </div>
          </div>
        `;
      }
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
